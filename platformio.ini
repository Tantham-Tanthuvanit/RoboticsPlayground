; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting

[platformio]
default_envs = esp32dev

; ================================================================
; OPTION A: ESP32-S3 via Wi-Fi UDP Bridge (Current Board)
; ================================================================
[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:fix_intellisense.py
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
build_flags = 
    -D TELEOP_MODE=0

lib_deps = 
    adafruit/Adafruit BNO08x @ ^1.2.3
    Wire

; ================================================================
; OPTION B: Classic ESP32 (WROOM-32) via Native Bluetooth Classic
; ================================================================
[env:esp32_classic_bt]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
build_flags = 
    -D TELEOP_MODE=1

lib_deps = 
    adafruit/Adafruit BNO08x @ ^1.2.3
    Wire
    pablomarquez76/PS4_Controller_Host @ ^1.0.9
